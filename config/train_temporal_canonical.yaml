defaults:
  - _self_
  - task: mimicgen_pc_abs

name: train_temporal_canonical
_target_: canonical_policy.workspace.train_temporal_canonical_workspace.TrainTemporalCanonicalWorkspace

shape_meta: ${task.shape_meta}
exp_name: "debug"

# 通用任务设置（可与 task.* 交互）
task_name: stack_d1
n_demo: 100
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}

# 数据路径由 task 复用
dataset_target: canonical_policy.dataset.robomimic_replay_point_cloud_dataset.RobomimicReplayPointCloudDataset
dataset_path: data/robomimic/datasets/${task_name}/${task_name}_voxel_abs.hdf5

policy:
  _target_: canonical_policy.policy.diffusion_temporal_canonical_policy.DiffusionTemporalCanonicalPolicy
  shape_meta: ${shape_meta}
  use_pc_color: false
  pointnet_type: "cp_so2"
  diffusion_step_embed_dim: 128
  down_dims: [128, 256, 384]
  kernel_size: 5
  n_groups: 8
  encoder_output_dim: 64
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: true
  cond_predict_scale: true
  canonical_encoder_cfg:
    num_points: 256
    neighbor_num: 10
    rot_hidden_dim: 48
    rot_layers: 4
  # 噪声调度器（与原配置一致，亦可改为 DDPM 等）
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: sample

  # 采样步数与 canonical 保持一致
  num_inference_steps: 10

  # 时序规范 Transformer 配置
  transformer_cfg:
    d_model: 16
    nhead: 4 #标记
    num_layers: 2 #标记
    dim_feedforward: 32
    dropout: 0.1
    max_time_steps: 128  #标记
    max_num_points: 1024
    vn_feature_dim: 16
    vn_layers_init: 1
    vn_layers_final: 1
    vn_ksize: 4
    use_gradient_checkpointing: false

ema:
  _target_: canonical_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 8.0e-5
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 17
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: ${eval:'50000 / ${n_demo}'}
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: ${eval:'5000 / ${n_demo}'}
  checkpoint_every: ${eval:'5000 / ${n_demo}'}
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0  

logging:
  project: canonical_${task_name}
  resume: true
  mode: online
  name: ${policy.pointnet_type}_${n_demo}_temporal
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  save_ckpt: true
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num} 